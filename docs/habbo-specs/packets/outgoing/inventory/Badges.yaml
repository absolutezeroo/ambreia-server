manual:
  official_values:
    source: capture inventory-open-official-001, habbo.fr, 2026-09-19, on opening the badge tab
    note: "totalFragments 1 / fragmentNo 0 -- the fragment number is zero-based even for a single fragment -- then 13 badges. Their first field holds real badge ids (226, 137, 14745, 10294, ...), which is what settles it as badgeId rather than a slot: thirteen distinct large values in a message that is not about equipping. Every badge reports ownerCount 1000 and badgeRarityId 0, so neither is per-badge data on this hotel."
  vortex_divergence:
    note: "BadgesEventMessageComposerSerializer writes badge.SlotId into field 3. The client reads it as badgeId, so every unequipped badge arrives as 0: the code -> id map stays empty (the guard is badgeId > 0) and every badge shares the unseen key 0, which is the key ResetUnseenItems(4) clears. Fixing it needs a badge id on PlayerBadgeSnapshot, which does not carry one today."
