manual:
  scanner_blind_spot:
    note: "The layout above is missing one field the client really reads. Between category (7) and is_recyclable (8) the constructor calls _SafeCls_4400.parseStuffData(), which consumes an int type tag and then whatever that tag's class reads -- a legacy string for tag 0. The scanner does not follow into it, so it is absent from every field count here and from the field_count conflict. The official capture records it as stuff_data_type 0 followed by an empty legacy string."
  official_values:
    source: capture inventory-open-official-001, habbo.fr, 2026-09-19, on opening the furni tab
    note: "totalFragments 1 / fragmentNo 0, then two floor items. Each one: itemId -424403720 / roomItemId +424403720 and itemId -425256255 / roomItemId +425256255 -- the same number twice with opposite signs, itemId negative and roomItemId positive on the floor. Vortex serializes the mirror of that. The client only enforces the relation (FurniModel.as:1482 tests -objectId == ref on the floor and objectId == ref on the wall), so both pass; what differs is which server handler receives a negative id. Both items also carry secondsToExpiration -1 and flatId -1, not 0."
  unknowns_settled:
    uk_9aec983546: "Fields 2 to 16 are named above from the item class's own getters (_SafeCls_3243), with the official capture supplying the values. The repeated block is read by a data class the scanner does not enter, which is why the generated names were all placeholders."
