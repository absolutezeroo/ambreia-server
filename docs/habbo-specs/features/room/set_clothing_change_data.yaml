verified:
  one_gender_per_message_merged_into_two:
    confidence: assumed
    claim: The booth stores "<boyLook>,<girlLook>" and a message carrying one gender merges into that string rather than replacing it.
    reason: "FurnitureClothingChangeLogic splits the item's data on a comma and takes index 0 as furniture_clothing_boy and index 1 as furniture_clothing_girl, while the packet carries a single gender and a single look. Overwriting would clear the outfit nobody was editing, which is invisible until someone of the other gender uses the booth. What the official server stores is unknown; the two-part string is what the client reads."
    evidence:
    - kind: client_code
      source: com/sulake/habbo/room/object/logic/furniture/FurnitureClothingChangeLogic.as
      symbol: updateClothingData
  unknown_gender_writes_the_boys_half:
    confidence: assumed
    claim: A gender that is neither M nor F is written to the boys' half.
    reason: The client sends M or F. Accepting the packet and changing nothing would be indistinguishable from a booth that refuses to save, so an unexpected value writes somewhere rather than nowhere.
