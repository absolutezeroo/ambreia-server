  the_count_is_strings_not_pairs:
    confidence: assumed
    claim: The integer after the item id is the number of STRINGS that follow -- twice the number of key/value pairs.
    reason: "The client's composer pushes `map.length * 2` and then each key and each value in turn, so two pairs announce themselves as four. Reading it as a pair count consumes half the message and leaves the remainder to be read as the next packet's header. This is the one field the specs could not confirm from the client parser (the reader could not follow that class), so it is recorded here from the composer instead."
    evidence:
    - kind: client_code
      source: unknowns/_SafePkg_1746/_SafeCls_3000.as
      symbol: _SafeCls_3000
  keys_are_merged_not_replaced:
    confidence: assumed
    claim: The pairs are merged into the furni's existing data key by key; keys not mentioned are left alone.
    reason: "The client sends the fields its editor showed, and a furni's data generally carries more than one editor writes. Replacing the whole map would clear whatever another dialog had set. What the official server does is unknown. An empty key is dropped: it round-trips as a nameless field and shows up as a blank row in every editor that reads the furni afterwards."
