manual:
  reference_variable_context: "A reference-variable box (wf_var_reference) is the one wired box whose reply depends on who opened it. Its dialog picks a variable out of ANOTHER room, so it needs a `SharedVariables` (context type 4) section listing every variable shared by the opener's rooms — room id, room name, then the variable. Vortex emitted none of the seven context sections beyond 0/1/3, so `WiredContext.referenceVariablesList` came back null and ReferenceVariable.onEditStart called setEditable(false): the name field, both dropdowns and the read-only checkbox were all disabled, with nothing on the wire to say why. Fixed 2026-09-14."
  empty_is_not_absent: The section must be sent even when the player shares nothing. The client greys the dialog on `context != null`, not on the list being non-empty, so omitting an empty section is indistinguishable from the bug above.
  scope_is_the_openers_own_rooms: "The list is joined on the room's owner, so a player sees only the variables their own rooms share. A room they merely hold rights in belongs to its owner and stays out — variable names are configuration, and the dropdown is not a place to leak someone else's. Official behaviour is unknown; this is the narrow reading and it is the safe one."
  read_from_the_database_not_from_the_rooms: "Those rooms are not running, and activating every room a player owns to ask each what it shares is not viable. WiredSharedVariableIndex rebuilds each variable from the furni row instead: the furni id IS the variable id (WiredVariableIdBuilder.CreateFromBoxId), and the rest is the box's wired config, which is JSON on the row. The cost is freshness — a box edited moments ago in a room that is still loaded is written by that room's next save pass, so this can lag by that interval."
  only_two_boxes_can_share: "wf_var_room and wf_var_user, the two whose GetIntParamRules() offer WiredAvailabilityType.Shared (11). Every other variable box's availability is fixed and never Shared."
