verified:
  the_list_gates_the_selector:
    confidence: client_confirmed
    claim: "The answer is the set of style ids the player may pick from the chat-bubble selector, and it is the only thing that unlocks one: RoomChatInputView classes any library id in 1000..9999 as an unlock and skips it unless SessionDataManager.hasNftChatStyle(id) is true, which is true only for an id this message carried."
    reason: "SessionDataManager.onNftChatStyles assigns the parsed vector straight to _nftChatStyles and nothing else writes it, so an unanswered request leaves the field null and hasNftChatStyle returns false for every id. The hotel's own chatstyles library carries twenty-five ids in that band (1000-1026)."
    evidence:
    - kind: client_code
      source: com/sulake/habbo/ui/widget/chatinput/RoomChatInputView.as
      symbol: isNftChatStyle
    - kind: client_code
      source: com/sulake/habbo/session/SessionDataManager.as
      symbol: onNftChatStyles
  a_resend_is_the_refresh:
    confidence: client_confirmed
    claim: Re-sending the whole unlock list unasked is how a mid-session unlock reaches the client; there is no add or remove message for that band.
    reason: onNftChatStyles replaces the vector outright rather than merging, and the registry holds no second message for the unlock band. The purchasable band does have one -- UserPurchasableChatStyleChanged, a boolean and an id, spliced into the vector -- which is why the two bands refresh differently.
    evidence:
    - kind: client_code
      source: com/sulake/habbo/session/SessionDataManager.as
      symbol: onNftChatStyles
    - kind: client_code
      source: com/sulake/habbo/session/SessionDataManager.as
      symbol: onPurchasableChatStyleChanged
  asked_at_session_init:
    confidence: client_confirmed
    claim: The client sends this from SessionDataManager.initSessionData, at login -- not when the Collectors Guild opens.
    reason: "initSessionData sends the composer alongside the ignore list and the income-reward status. It matters because the chat-style selector needs the answer whether or not the player ever opens the collectibles hub, and because it is the only login-time request in this family: UserPurchasableChatStyles has no request header at all, so the server volunteers it on the back of this one."
    evidence:
    - kind: client_code
      source: com/sulake/habbo/session/SessionDataManager.as
      symbol: initSessionData
manual:
  band_above_9999: "From 10000 up the client asks hasPurchasableChatStyle instead, fed by UserPurchasableChatStyles (3774) and kept current by UserPurchasableChatStyleChanged (3971). Both are answers with no request opposite them, so the list rides on this message's reply and the incremental one is sent when a style moves. A purchasable style is bought as an ordinary catalog product of type \"chat_style\" whose extra param is the id."
  ids_below_1000: Static styles. The client gates them itself on club, ambassador and staff rights and never asks the server, so granting one would write a row nothing reads.
