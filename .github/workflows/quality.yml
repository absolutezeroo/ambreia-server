name: Code Quality

on:
  push:
  pull_request:

jobs:
  quality:
    name: quality-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The gate runs the repository hooks (scripts/hooks/*.mjs), which are plain node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Explicit and solution-wide. The gate's inner steps all pass --no-restore, and building
      # Vortex.Main only restores its own dependency graph — the test projects are not in it, so
      # `dotnet test Vortex.Cloud.sln --no-restore` had no assets to work from on a clean checkout.
      - name: Restore
        run: dotnet restore Vortex.Cloud.sln

      - name: Restore local tools
        run: dotnet tool restore

      # Phase 2 promotes the selected nullable/reliability diagnostics
      # (CS8602;CS8604;CS8618;CA2000;CA2012;CA2201;IDE0005;IDE0058) from warnings to errors.
      # Verified green on the whole solution before being turned on here; the remaining historical
      # warning categories stay warnings on purpose, so the ratchet moves one notch rather than
      # turning every legacy warning into a build break at once.
      - name: Quality gate (build + tests + format + analyzers)
        run: >-
          dotnet build Vortex.Main/Vortex.Main.csproj
          -t:VortexCloudQualityGate
          -p:VortexAIPolicyPhase=2

      # The forward-script runner's own rules (numbering, pending set, connection parsing); the
      # scripts themselves run against a real MySQL in the job below.
      - name: Forward runner unit tests
        run: node --test scripts/sql/forward.test.mjs scripts/content/pull.test.mjs

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the output has
      # to be inspected. Transitive packages are included: that is where most advisories land.
      - name: Scan for vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Vortex.Cloud.sln package --vulnerable --include-transitive \
            --no-restore > vulnerable.txt 2>&1 || true
          cat vulnerable.txt
          if grep -qiE '(Critical|High|Moderate|Low)$|has the following vulnerable packages' vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected. See the report above."
            exit 1
          fi
          echo "No vulnerable packages reported."

  # The live database moves by scripts/sql/forward/NNN-*.sql, not by the regenerated InitialCreate.
  # Nothing on a developer's machine runs that chain end to end, so this job does: InitialCreate on
  # a throwaway MySQL 8, then every forward script in order (each is a no-op on a schema that already
  # has it, which is what proves it still parses and runs), then the runner again (0 pending).
  forward-scripts:
    name: forward-scripts-mysql
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: vortex_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      Vortex__Database__ConnectionString: "Server=127.0.0.1;Port=3306;Database=vortex_ci;User Id=root;Password=ci-root;"
      VORTEX__Vortex__Database__ConnectionString: "Server=127.0.0.1;Port=3306;Database=vortex_ci;User Id=root;Password=ci-root;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore Vortex.Cloud.sln
      - name: InitialCreate
        shell: pwsh
        run: ./scripts/ef.ps1 database update
      - name: Forward scripts, in order, once each
        run: node scripts/sql/forward.mjs
      - name: Forward scripts, again (nothing pending)
        run: node scripts/sql/forward.mjs --list | tee forward.txt && grep -q " 0 pending" forward.txt
